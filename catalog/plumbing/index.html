    const w = document.getElementById("waste");
    w.onchange = () => {
      S.waste = Math.max(0, Math.min(30, Math.round(+w.value || 0)));
      if (S.tab !== "boq") S.tab = "boq";
      D.table(tableHtml()); bindTable(); renderSide();
      D.cmd(`PLUMBEREXPORT WASTE=${S.waste}%`);
    };
  }
}
const mSrcDefault = (k) => { const rs = runs.filter((r) => r.s === k && r.ds === "default"); return { n: rs.length, m: rs.reduce((a, r) => a + r.m, 0) }; };
function setMap(k, v) {
  if (!v) return;
  const old = S.map[k];
  S.map[k] = v;
  if (v !== "NONE" && !(MAT_OK[v] || []).includes(S.mat[k])) S.mat[k] = MAT_DEF[v];
  const m = mSrc(k);
  D.cmd(`PLUMBER MAP ${srcBy[k].layer} -> ${SYS[v].code || "SKIP"}`);
  D.toast(v === "NONE" ? `${srcBy[k].layer} לא תיספר (${fmt(m, 1)} מ׳ ירדו מהסיכום)` : `${srcBy[k].layer} → ${SYS[v].name}: ${fmt(m, 1)} מ׳ ${old ? "עברו" : "נוספו"} למערכת, חומר ${MAT[S.mat[k]].n}`);
  D.track("demo_action", { action: "map_layer" });
  renderSide(); paint(); updateKpi();
}
function zoomRuns(rs, always) {
  if (!rs.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  rs.forEach((r) => r.pts.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }));
  if (!always && (x1 - x0 > W * 0.6 || y1 - y0 > H * 0.6)) return D.fit();
  const mw = always ? 1100 : 400, mh = always ? 700 : 300;
  D.zoomTo(x0 - Math.max(0, mw - (x1 - x0)) / 2, y0 - Math.max(0, mh - (y1 - y0)) / 2, Math.max(x1 - x0, mw), Math.max(y1 - y0, mh), 0.12);
}
function pickRoom(i) {
  if (i < 0) { S.sel = null; D.fit(); D.cmd("PLUMBER FITTINGS ALL"); }
  else {
    const r = DATA.rooms[i];
    S.sel = { r: r.r, room: i };
    D.cmd(`PLUMBER FITTINGS ROOM="${r.n}"`);
    if (NARROW) {
      const x0 = Math.min(...r.r.map((b) => b[0])), y0 = Math.min(...r.r.map((b) => b[1]));
      const x1 = Math.max(...r.r.map((b) => b[0] + b[2])), y1 = Math.max(...r.r.map((b) => b[1] + b[3]));
      D.zoomTo(x0, y0, x1 - x0, y1 - y0, 0.1);
    }
  }
  D.track("demo_action", { action: "room" });
  paint(); renderSide();
}

/* hover / tap on the canvas */
function runAt(e) {
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const g = hit && hit.closest && hit.closest(".run");
  return g ? runs[+g.dataset.r] : null;
}
function showTip(e, html) {
  const rc = D.canvas.getBoundingClientRect();
  tip.innerHTML = html;
  tip.hidden = false;
  let x = e.clientX - rc.left + 14, y = e.clientY - rc.top + 14;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw > rc.width - 6) x = e.clientX - rc.left - tw - 14;
  if (y + th > rc.height - 6) y = e.clientY - rc.top - th - 14;
  tip.style.left = Math.max(4, x) + "px";
  tip.style.top = Math.max(4, y) + "px";
}
const runTip = (r) => {
  const s = sysOf(r);
  return `<b>${s ? sname(s) : "טרם שויך"}</b> · <span class="mono">${esc(diaOf(r))}</span>${s && isGrav(s) && r.sl != null ? ` · <span class="mono">${r.sl}%</span>` : ""}<br><b class="mono">${fmt(r.m, 2)} מ׳</b>${s && s !== "NONE" ? ` · ${MAT[matOf(r)].n}` : ""}<br><span class="m">שכבה <span class="mono">${esc(srcBy[r.s].layer)}</span><br>קוטר לפי ${DS[r.ds]}</span>`;
};
svg.addEventListener("pointermove", (e) => {
  if (drag || e.buttons) { tip.hidden = true; return; }
  const st = D.step;
  if (st === 4) {
    const p = e.target.closest && e.target.closest(".pt");
    if (p) {
      const pt = DATA.pts[+p.dataset.p], s = ptSys(pt);
      showTip(e, `<b>${esc(PK[pt.k].n)}</b>${pt.d ? ` <span class="mono">${esc(pt.d)}</span>` : ""}<br><span class="m">${s ? sname(s) : ""} · ${PCAT[PK[pt.k].c].split(":")[0]}${PK[pt.k].tag ? "<br>" + PK[pt.k].tag : ""}<br>שכבה <span class="mono">${esc(ptLayer(pt))}</span></span>`);
    } else tip.hidden = true;
    return;
  }
  if (st > 3) { tip.hidden = true; return; }
  const g = e.target.closest && e.target.closest(".run");
  if (!g) { tip.hidden = true; D.barMid(""); return; }
  const r = runs[+g.dataset.r];
  D.barMid(`Layer: <b>${esc(srcBy[r.s].layer)}</b>`);
  if (st === 1) showTip(e, `<b class="mono">${esc(srcBy[r.s].layer)}</b><br><span class="m">${srcBy[r.s].kind === "double" ? `קו כפול, רוחב ${fmt(r.w || 0, 1)} ס״מ` : "קו"} · ${r.pts.length - 1} מקטעים</span>`);
  else showTip(e, runTip(r));
});
svg.addEventListener("pointerleave", () => { tip.hidden = true; });
svg.addEventListener("click", (e) => {
  const st = D.step;
  if (st === 3) {
    const r = runAt(e);
    if (!r) return;
    S.pinned = S.pinned === r.i ? null : r.i;
    if (S.pinned != null) { D.cmd(`PLUMBER LIST ${srcBy[r.s].layer} L=${r.m.toFixed(2)}m`); D.track("demo_action", { action: "pick_run" }); showTip(e, runTip(r)); }
    paint(); renderSide();
  } else if (st === 2) {
    const r = runAt(e);
    if (!r) return;
    const row = D.sideEl.querySelector(`.mrow[data-src="${r.s}"]`);
    if (row) { row.scrollIntoView({ block: "nearest" }); row.style.borderColor = "var(--redline)"; setTimeout(() => (row.style.borderColor = ""), 1200); }
    S.hoverSrc = r.s; paint();
    setTimeout(() => { S.hoverSrc = null; paint(); }, 1200);
  }
});

/* drag a window to count in an area (step 4) */
let drag = null;
svg.addEventListener("pointerdown", (e) => {
  if (D.step !== 4 || e.button !== 0) return;
  drag = { s: D.pt(e), cur: D.pt(e) };
  try { svg.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
});
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = D.pt(e);
  drag.cur = p;
  selRect.setAttribute("x", Math.min(drag.s.x, p.x)); selRect.setAttribute("y", Math.min(drag.s.y, p.y));
  selRect.setAttribute("width", Math.abs(p.x - drag.s.x)); selRect.setAttribute("height", Math.abs(p.y - drag.s.y));
  if (Math.abs(p.x - drag.s.x) > 40 || Math.abs(p.y - drag.s.y) > 40) selRect.setAttribute("visibility", "visible");
});
svg.addEventListener("pointerup", (e) => {
  if (D.step !== 4 || !drag) return;
  const p = drag.cur, moved = Math.abs(p.x - drag.s.x) > 40 || Math.abs(p.y - drag.s.y) > 40;
  selRect.setAttribute("visibility", "hidden");
  if (moved) {
    const x = Math.min(drag.s.x, p.x), y = Math.min(drag.s.y, p.y), w = Math.abs(p.x - drag.s.x), h = Math.abs(p.y - drag.s.y);
    S.sel = { r: [[x, y, w, h]], room: null };
    D.cmd(`PLUMBER FITTINGS WINDOW (${Math.round(x)},${Math.round(H - y - h)}) (${Math.round(x + w)},${Math.round(H - y)})`);
    D.track("demo_action", { action: "window" });
    drag = null;
    paint(); renderSide();
    return;
  }
  drag = null;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const rg = hit && hit.closest && hit.closest(".room");
  if (rg) pickRoom(S.sel && S.sel.room === +rg.dataset.room ? -1 : +rg.dataset.room);
});

function onStep(n, _D, prev) {
  if (n >= 3 && PIPE_SRC.some((k) => !S.map[k])) {
    PIPE_SRC.filter((k) => !S.map[k]).forEach((k) => { S.map[k] = SRC[k].sug || "NONE"; S.mat[k] = MAT_DEF[S.map[k]] || null; });
    D.toast("השכבה שלא שויכה קיבלה את המערכת המוצעת (ביוב)");
  }
  if (n !== 3) { S.hiRow = null; S.pinned = null; S.qa = null; }
  if (n !== 2) S.hoverSrc = null;
  tip.hidden = true;
  D.barMid("");
  D.canvas.classList.toggle("selecting", n === 4);
  D.panLeft(n !== 4);
  if (prev === 3 || prev === 4) D.fit();
  D.table(n === 5 ? tableHtml() : null);
  if (n === 5) bindTable();
  paint(); renderSide(); updateKpi();
  if (n === 1 && !prev) D.hint("גלגלת או צביטה להגדלה, גרירה להזזה");
  if (n === 2 && PIPE_SRC.some((k) => !S.map[k])) D.hint("שכבה אחת לא זוהתה לפי השם. מצאו אותה ברשימה");
  if (n === 3) D.hint(openFinds() ? `התוסף מצא ${openFinds()} ממצאים לבדיקה. ראו "בדיקות תכנון"` : "רחפו או הקישו על קו כדי לראות את האורך שלו");
  if (n === 4) D.hint("לחצו על חדר או גררו מלבן על אזור");
}

D.ready();
})();
</script>

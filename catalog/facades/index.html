<script src="/catalog/shell/shell.js"></script>
<script>
(() => {
/* MODEL-START (also read by tools/demos/facades/thumb.js; keep it free of DOM and shell calls)
   Synthetic shop drawing of a north elevation: residential building, ground + 3 floors + roof parapet.
   Units: mm. x to the right, z up from ±0.00. Panels are drawn at their net (production) size;
   the gap between two rectangles is the joint. */
const MATS = {
  LB: { name: "לוקובונד", full: "לוקובונד 4 מ״מ, ליבה FR", layer: "A-CLAD-LB", raw: "#4DD0E1", hue: 192, sat: 48,
        joint: 20, flange: 40, bd: 1.0, kg: 7.6, line: "CNC + כיפוף",
        widths: [1000, 1250, 1500, 1575, 2000], lengths: [2500, 3200, 4000, 5000], maxL: 5000, minL: 2000, margin: 10, gap: 10 },
  HPL: { name: "HPL", full: "HPL קומפקט 8 מ״מ", layer: "A-CLAD-HPL", raw: "#FFD54F", hue: 34, sat: 62,
        joint: 10, flange: 0, bd: 0, kg: 11.2, line: "CNC",
        sheets: [[1300, 3050], [1530, 3050], [1850, 4270]], margin: 10, gap: 6 },
  AL: { name: "פח", full: "פח אלומיניום 2 מ״מ, צבוע בתנור", layer: "A-CLAD-MTL", raw: "#E57BD8", hue: 292, sat: 40,
        t: 2, R: 2, K: 0.4, kg: 5.4, line: "גיליוטינה + מכופפת",
        sheets: [[1250, 2500], [1500, 3000]], margin: 5, gap: 0, strips: true },
};
const CNC_BED = [2100, 5100];
const E_LB = MATS.LB.flange - MATS.LB.bd;          // flat flange width on the blank, per edge
const NEAR_TOL = 4;                                 // mm: "almost the same panel"
const HPL_EDGE = 40, HPL_PITCH = 600;               // rivet edge distance and max pitch for 8 mm HPL
const HANG_PITCH = 600, STIFF_PITCH = 800;          // cassette hanging slots and back stiffeners
const OVERLAP = 50;                                 // overlap when a flashing is split
const COPC_PART = 980;                              // coping corner: one mitred half (600 leg + mitre allowance)
const AL_MAX = Math.max(...MATS.AL.sheets.map((s) => s[1])) - 2 * MATS.AL.margin;

/* folded aluminium sections, outside mould line, mm. legs and bend angles are derived from the points */
const PROF = {
  sill:   { pts: [[0, 25], [0, 0], [190, -16.6], [190, -66.6], [200.6, -77.2]] },
  head:   { pts: [[0, 20], [0, 0], [150, 0], [150, -40], [158.5, -48.5]] },
  jamb:   { pts: [[0, 20], [0, 0], [150, 0], [150, 40]] },
  coping: { pts: [[-10.6, -70.6], [0, -60], [0, 0], [360, 31.5], [360, -48.5], [370.6, -59.1]] },
};
const bdAL = (deg) => { const M = MATS.AL, a = (deg * Math.PI) / 180; return 2 * (M.R + M.t) * Math.tan(a / 2) - a * (M.R + M.K * M.t); };
Object.values(PROF).forEach((p) => {
  const P = p.pts;
  p.legs = P.slice(1).map((q, i) => Math.hypot(q[0] - P[i][0], q[1] - P[i][1]));
  p.ang = P.slice(1, -1).map((q, i) => {
    const a = [q[0] - P[i][0], q[1] - P[i][1]], b = [P[i + 2][0] - q[0], P[i + 2][1] - q[1]];
    const c = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(...a) * Math.hypot(...b));
    return Math.round((Math.acos(Math.max(-1, Math.min(1, c))) * 180) / Math.PI);
  });
  p.bd = p.ang.map(bdAL);
  p.dev = Math.round((p.legs.reduce((s, v) => s + v, 0) - p.bd.reduce((s, v) => s + v, 0)) * 10) / 10;
});

const BAYS = [600, ...Array(13).fill(1200), 600];
const bayX = []; { let x = 0; for (const b of BAYS) { bayX.push(x); x += b; } }
const W = 16800, PLINTH = 150, TOP = 15000, H = 15060, LAST = BAYS.length - 1;
const floors = [{ name: "קרקע", z: 0, h: 4200 }, { name: "קומה 1", z: 4200, h: 3200 }, { name: "קומה 2", z: 7400, h: 3200 }, { name: "קומה 3", z: 10600, h: 3200 }, { name: "מעקה וקופינג", z: 13800, h: 1200 }];
const LEVELS = [0, 4200, 7400, 10600, 13800, 15000];
const AXES = [["1", 0], ["2", 5400], ["3", 11400], ["4", 16800]];
const GROUND_ROWS = [[PLINTH, 1500], [1500, 2850], [2850, 4200]];
const CORNER_SIDE = 290;                            // corner cassette leg on the side elevation (from the floor plan)
const SURVEY = { "2:9": [-3, 0], "3:4": [0, -4] };  // panels drawn a few mm off after the site survey

const openings = [];
const addO = (id, i0, n, z, h, floor, mat, door) => openings.push({ id, i0, n, x: bayX[i0], w: BAYS.slice(i0, i0 + n).reduce((a, b) => a + b, 0), z, h, floor, mat, door: !!door });
addO("G-1", 2, 2, 1500, 1350, 0, "HPL");
addO("G-2", 11, 2, 1500, 1350, 0, "HPL");
addO("G-E", 6, 3, 0, 2850, 0, "HPL", true);
for (let f = 1; f <= 3; f++) {
  const z = floors[f].z + 900;
  addO(f + "-A", 2, 2, z, 1600, f, "LB"); addO(f + "-B", 7, 1, z, 1600, f, "LB"); addO(f + "-C", 11, 2, z, 1600, f, "LB");
}
openings.forEach((o) => {
  const j = MATS[o.mat].joint / 2;
  Object.assign(o, { cx: o.x + j, cw: o.w - 2 * j, cz: o.door ? o.z : o.z + j, ch: o.door ? o.h - j : o.h - 2 * j });
});
const openingAt = (i, z0, z1, floor) => openings.find((o) => o.floor === floor && i >= o.i0 && i < o.i0 + o.n && o.z < z1 && o.z + o.h > z0);

const items = [], splitEnts = [], splitLog = [];
let uid = 0;
const nid = () => "i" + ++uid;
function addPanel(mat, kind, role, i, z0, z1, floor, extra = {}) {
  const j = MATS[mat].joint / 2, x = bayX[i], bw = BAYS[i];
  const x0 = i === 0 ? 0 : x + j, x1 = i === LAST ? W : x + bw - j;
  const p = { id: nid(), mat, kind, role, floor, bay: i, x: x0, z: z0 + j, w: x1 - x0, h: z1 - z0 - 2 * j, mx: x, mz: z0, mw: bw, mh: z1 - z0, ...extra };
  const dv = SURVEY[floor + ":" + i];
  if (dv && kind === "flat") { p.w += dv[0]; p.h += dv[1]; }
  items.push(p);
  return p;
}
// ground floor: compact HPL in three rows above a 150 mm plinth, flat panels with a corner profile at the corners
BAYS.forEach((_, i) => GROUND_ROWS.forEach(([z0, z1]) => {
  if (!openingAt(i, z0, z1, 0)) addPanel("HPL", i === 0 || i === LAST ? "edge" : "flat", "field", i, z0, z1, 0);
}));
// floors 1-3: full-height cassettes, split at sill and head where there is a window, L cassettes at the corners
for (let f = 1; f <= 3; f++) {
  const { z, h } = floors[f];
  BAYS.forEach((_, i) => {
    if (i === 0 || i === LAST) return addPanel("LB", "corner", "field", i, z, z + h, f, { side: CORNER_SIDE, hand: i === 0 ? "L" : "R" });
    const o = openingAt(i, z, z + h, f);
    if (!o) return addPanel("LB", "flat", "field", i, z, z + h, f);
    addPanel("LB", "flat", "below", i, z, o.z, f);
    addPanel("LB", "flat", "above", i, o.z + o.h, z + h, f);
  });
}
// parapet: 1200 above the roof slab (about 1050 above the roof finish), same cassette system
BAYS.forEach((_, i) => {
  if (i === 0 || i === LAST) addPanel("LB", "corner", "parapet", i, 13800, TOP, 4, { side: CORNER_SIDE, hand: i === 0 ? "L" : "R" });
  else addPanel("LB", "flat", "parapet", i, 13800, TOP, 4);
});
// aluminium flashings around every opening: sill, head, two jambs (no sill at the entrance)
const dev = (k) => PROF[k].dev;
function addAL(kind, len, rect, floor, extra = {}) {
  const it = { id: nid(), mat: "AL", kind, len, dev: dev(kind === "copc" ? "coping" : kind), floor, ...rect, ...extra };
  items.push(it);
  return it;
}
function addLinear(kind, len, rect, floor, extra, label) {
  if (len <= AL_MAX) return [addAL(kind, len, rect, floor, extra)];
  const n = Math.ceil((len + OVERLAP) / AL_MAX), part = Math.ceil((len + (n - 1) * OVERLAP) / n);
  const ent = { id: "e" + (splitEnts.length + 1), mat: "AL", kind, len, ...rect, parts: [] };
  splitEnts.push(ent);
  const segW = rect.w / n;
  for (let k = 0; k < n; k++) ent.parts.push(addAL(kind, part, { ...rect, x: rect.x + k * segW + (k ? 15 : 0), w: segW - 15 }, floor, { ...extra, src: ent.id, split: true }).id);
  splitLog.push({ kind: "split", text: `${label} ${len} מ״מ ארוך מפלטת הפח (${AL_MAX + 2 * MATS.AL.margin}): פוצל ל־${n} חלקים של ${part} עם חפיפה ${OVERLAP} מ״מ וסיליקון.` });
  return ent.parts;
}
openings.forEach((o) => {
  const ex = { open: o.id };
  if (!o.door) addAL("sill", o.cw + 50, { x: o.cx - 25, z: o.cz - 45, w: o.cw + 50, h: 50 }, o.floor, ex);
  addAL("jamb", o.ch, { x: o.cx, z: o.cz, w: 40, h: o.ch }, o.floor, ex);
  addAL("jamb", o.ch, { x: o.cx + o.cw - 40, z: o.cz, w: 40, h: o.ch }, o.floor, ex);
  addLinear("head", o.cw, { x: o.cx, z: o.cz + o.ch - 40, w: o.cw, h: 40 }, o.floor, ex, o.door ? "ראש פתח הכניסה" : "ראש פתח");
});
// coping: drawn as one line over the whole elevation; produced as 2 mitred corners + equal straight segments with 5 mm joints
{
  const cz = TOP - 40, chh = H - cz, legN = 600, gapC = 5;
  const ent = { id: "e" + (splitEnts.length + 1), mat: "AL", kind: "coping", len: W, x: 0, z: cz, w: W, h: chh, parts: [] };
  splitEnts.push(ent);
  const run = W - 2 * legN, n = Math.ceil(run / AL_MAX), seg = Math.floor((run - (n + 1) * gapC) / n);
  ent.parts.push(addAL("copc", 2 * legN, { x: 0, z: cz, w: legN, h: chh }, 4, { hand: "L", src: ent.id, parts: 2 }).id);
  for (let k = 0; k < n; k++) ent.parts.push(addAL("coping", seg, { x: legN + gapC + k * (seg + gapC), z: cz, w: seg, h: chh }, 4, { src: ent.id }).id);
  ent.parts.push(addAL("copc", 2 * legN, { x: W - legN, z: cz, w: legN, h: chh }, 4, { hand: "R", src: ent.id, parts: 2 }).id);
  splitLog.push({ kind: "split", text: `קופינג רציף ${W / 1000} מ׳ בשרטוט: חולק ל־2 פינות במיטר ול־${n} קטעים של ${seg} מ״מ, מישק ${gapC} מ״מ עם פס חיבור מתחת (${n + 1} יח׳).` });
}
const byId = Object.fromEntries(items.map((p) => [p.id, p]));
const ents = [...items.filter((p) => !p.src), ...splitEnts];

/* completeness groups: flashings that are installed before (or with) the panels around them */
const touches = (p, o) => {
  const ox = p.mx < o.x + o.w && p.mx + p.mw > o.x, oz = p.mz < o.z + o.h && p.mz + p.mh > o.z;
  return (ox && (p.mz + p.mh === o.z || p.mz === o.z + o.h)) || (oz && (p.mx + p.mw === o.x || p.mx === o.x + o.w));
};
const groups = openings.map((o) => ({ label: o.door ? "door" : "win", need: items.filter((p) => p.open === o.id).map((p) => p.id), adj: items.filter((p) => p.mat !== "AL" && p.floor === o.floor && touches(p, o)).map((p) => p.id) }));
groups.push({ label: "coping", need: items.filter((p) => p.kind === "coping" || p.kind === "copc").map((p) => p.id), adj: items.filter((p) => p.role === "parapet").map((p) => p.id) });

/* production geometry */
function pieces(t) {
  if (t.mat === "LB") return [{ a: t.kind === "corner" ? t.w + t.side + 2 * E_LB - MATS.LB.bd : t.w + 2 * E_LB, b: t.h + 2 * E_LB }];
  if (t.mat === "HPL") return [{ a: t.w, b: t.h }];
  if (t.kind === "copc") return [{ a: t.dev, b: COPC_PART }, { a: t.dev, b: COPC_PART }];
  return [{ a: t.dev, b: t.len }];
}
const stiffeners = (t) => (t.mat === "LB" && t.w > STIFF_PITCH ? Math.max(0, Math.ceil(t.h / STIFF_PITCH) - 1) : 0);
const hangPerSide = (t) => Math.max(2, Math.ceil((t.h - 200) / HANG_PITCH) + 1);
const spread = (a, b, n) => (n < 2 ? [(a + b) / 2] : Array.from({ length: n }, (_, k) => a + (k * (b - a)) / (n - 1)));
function hplHoles(t) {
  const xs = spread(HPL_EDGE, t.w - HPL_EDGE, Math.ceil((t.w - 2 * HPL_EDGE) / HPL_PITCH) + 1);
  const ys = spread(HPL_EDGE, t.h - HPL_EDGE, Math.ceil((t.h - 2 * HPL_EDGE) / HPL_PITCH) + 1);
  let fx = 0, fy = 0, best = Infinity;
  xs.forEach((x, i) => ys.forEach((y, j) => { const d = Math.hypot(x - t.w / 2, y - t.h / 2); if (d < best - 1e-6) { best = d; fx = i; fy = j; } }));
  return { xs, ys, fx, fy, n: xs.length * ys.length };
}
function faceArea(t) { return t.mat === "AL" ? 0 : ((t.kind === "corner" ? t.w + t.side : t.w) * t.h) / 1e6; }
function devArea(t) { return pieces(t).reduce((s, p) => s + p.a * p.b, 0) / 1e6; }
function unitKg(t) {
  const M = MATS[t.mat];
  if (t.mat === "LB") {
    const notch = (t.kind === "corner" ? 6 : 4) * E_LB * E_LB / 1e6;
    return (devArea(t) - notch) * M.kg + stiffeners(t) * (t.w / 1000) * 0.4;
  }
  return devArea(t) * M.kg;
}

/* nesting: pieces {a: across the sheet width, b: along the sheet length}. No rotation: the coil-coated ACP and the
   HPL decor have a direction, and flashings are sheared along the sheet. Shelf (FFDH) packing per width class. */
const ceil50 = (v) => Math.ceil(v / 50) * 50;
function sheetOpts(k, custom) {
  const M = MATS[k];
  if (k === "LB") return custom ? M.widths.map((w) => ({ w, l: M.maxL, custom: true })) : M.widths.flatMap((w) => M.lengths.map((l) => ({ w, l })));
  return M.sheets.map(([w, l]) => ({ w, l }));
}
function homYield(p, o, M) {
  const na = Math.floor((o.w - 2 * M.margin + M.gap) / (p.a + M.gap)), nb = Math.floor((o.l - 2 * M.margin + M.gap) / (p.b + M.gap));
  if (na < 1 || nb < 1) return 0;
  const L = o.custom ? Math.max(M.minL, ceil50(2 * M.margin + nb * p.b + (nb - 1) * M.gap)) : o.l;
  return (na * nb * p.a * p.b) / (o.w * L);
}
function ffdh(ps, W, L, m, g, strips) {
  if (strips) { // flashings: shear strips of the developed width along the sheet, then crosscut the pieces end to end
    const r = ffdh(ps.map((p) => ({ a: p.b, b: p.a, t: p.t })), L, W, m, g, false);
    return r && r.map((s) => ({ w: W, l: L, used: s.used, parts: s.parts.map((q) => ({ x: q.y, y: q.x, a: q.b, b: q.a, t: q.t })) }));

  [...buy.values()].sort((a, b) => MO[a.mat] - MO[b.mat] || b.n - a.n).forEach((b, i) => { h += `<tr class="${i ? "" : "tot"}"><td class="sub">${i ? "" : "סה״כ לרכש"}</td><td>${MATS[b.mat].name}</td><td class="num">${b.size}</td><td class="num">${b.n}</td><td class="num">${fmt(b.area, 2)}</td><td class="num">${fmt(b.used, 2)}</td><td class="num">${pct(b.used / b.area)}</td><td class="num">${fmt(b.area - b.used, 2)}</td></tr>`; });
  return h + `</tbody></table>`;
}
const tsv = () => {
  const G = summary(), q = (s) => String(s).replace(/״/g, '"').replace(/׳/g, "'");
  const L = [["פק\"ע", "קוד", "תיאור", "חומר", "נטו", "פריסה", "יחידות", "מ\"ר נטו", "מ\"א", "מ\"ר פריסה", "ק\"ג"].join("\t")];
  G.forEach((g) => g.rows.forEach((r) => L.push([q(g.name), r.code, q(r.desc), q(r.mat), r.net, r.dev, r.n, r.m2.toFixed(2), r.ml.toFixed(2), r.m2d.toFixed(2), r.kg.toFixed(1)].join("\t"))));
  L.push("", ["פק\"ע", "חומר", "פלטה", "כמות", "מ\"ר פלטות", "מ\"ר פריסה", "ניצולת %", "פחת מ\"ר"].join("\t"));
  G.forEach((g) => g.sheets.forEach((s) => L.push([q(g.name), q(MATS[s.mat].name), s.size, s.n, s.area.toFixed(2), s.used.toFixed(2), ((s.used / s.area) * 100).toFixed(1), (s.area - s.used).toFixed(2)].join("\t"))));
  return L.join("\n");
};

/* ---------- interactions ---------- */
function setCustom(on) {
  if (S.custom === on) return;
  S.custom = on;
  D.cmd(`PA_NEST ACP_LENGTH=${on ? "CUT-TO-ORDER" : "STOCK"}`);
  D.track("demo_action", { action: "nest_" + (on ? "custom" : "stock") });
  if (D.step === 5) D.table(tableHtml());
  renderSide(); updateKpi();
}
function bindSide() {
  const side = D.sideEl;
  side.querySelectorAll("[data-custom]").forEach((b) => (b.onclick = () => setCustom(b.dataset.custom === "1")));
  if (D.step === 2) {
    side.querySelectorAll(".li").forEach((li) => {
      const t = S.types[+li.dataset.t];
      li.onmouseenter = () => { S.hoverType = t; paint(); };
      li.onmouseleave = () => { S.hoverType = null; paint(); };
      li.onclick = (e) => {
        if (e.target.tagName === "INPUT") return;
        S.pinType = S.pinType === t ? null : t;
        side.querySelectorAll(".li.on").forEach((x) => x.classList.remove("on"));
        if (S.pinType) li.classList.add("on");
        paint();
      };
    });
    side.querySelectorAll("input[data-ti]").forEach((inp) => {
      inp.onchange = () => {
        const t = S.types[+inp.dataset.ti], v = inp.value.trim().toUpperCase();
        if (!v || v === t.code) { inp.value = t.code; return; }
        if (S.types.some((x) => x !== t && x.code === v)) { inp.value = t.code; D.toast(`הקוד ${v} כבר קיים בקטלוג`); return; }
        const old = t.code; t.code = v; S.codes[t.key] = v; inp.value = v; paint();
        D.cmd(`PA_RENAME ${old} → ${v}`);
        D.toast(`הקוד ${old} שונה ל־${v} בכל ${t.ids.length} הפריטים`);
      };
    });
    side.querySelectorAll("[data-merge],[data-unmerge]").forEach((b) => (b.onclick = () => {
      const p = S.near[+(b.dataset.merge ?? b.dataset.unmerge)], on = b.dataset.merge != null, dst = typeByKey(p.dst);
      if (on) S.merge[p.src] = p.dst; else delete S.merge[p.src];
      D.cmd(on ? `PA_MERGE ${p.w}x${p.h} → ${dst.code}` : `PA_UNMERGE ${p.w}x${p.h}`);
      rebuildTypes();
      D.toast(on ? `${p.n} יח׳ אוחדו ל־${typeByKey(p.dst).code}. הקטלוג מוספר מחדש` : "האיחוד בוטל");
      D.track("demo_action", { action: on ? "merge" : "unmerge" });
      paint(); renderSide(); updateKpi();
    }));
  }
  if (D.step === 3) {
    side.querySelectorAll("[data-floor]").forEach((b) => (b.onclick = () => {
      const f = +b.dataset.floor;
      S.sel = new Set(items.filter((p) => p.floor === f).map((p) => p.id));
      D.cmd(`PA_SELECT LEVEL="${floors[f].name}"`);
      paint(); renderSide();
    }));
    const on = (id, fn) => { const x = document.getElementById(id); if (x) x.onclick = fn; };
    on("clearSel", () => { S.sel.clear(); paint(); renderSide(); });
    on("mkOrder", makeOrder);
    on("addMiss", () => { const m = missingFor(S.sel); m.ids.forEach((id) => S.sel.add(id)); D.cmd(`PA_SELECT ADD FLASHINGS=${m.ids.length}`); paint(); renderSide(); });
    on("undoOrd", () => {
      const o = S.orders.pop();
      o.ids.forEach((id) => delete S.assigned[id]);
      D.cmd(`PA_ORDER DELETE ORD-${o.n}`);
      D.toast(`${o.code} בוטלה. הפריטים חזרו לטרם שויך`);
      paint(); renderSide(); updateKpi();
    });
  }
  if (D.step === 4) side.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => pickType(S.types[+b.dataset.pick])));
  if (D.step === 5) document.getElementById("copyXls").onclick = () => { D.copy(tsv(), "הטבלאות הועתקו. הדביקו בגיליון אקסל"); D.track("demo_export"); };
}
function pickType(t) { S.selKey = t.key; D.cmd(`PA_ITEMCARD ${t.code}`); paint(); renderSide(); }
function makeOrder() {
  const free = [...S.sel].filter((id) => S.assigned[id] == null), skipped = S.sel.size - free.length;
  if (!free.length) return;
  const miss = missingFor(S.sel).ids.length;
  const i = S.orders.length, n = String(i + 1).padStart(2, "0"), code = "פק״ע-" + n;
  S.orders.push({ code, n, layer: "PA-ORD-" + n, color: ORDER_COLORS[i % ORDER_COLORS.length], ids: free });
  free.forEach((id) => (S.assigned[id] = i));
  S.sel.clear();
  D.cmd(`PA_ORDER NEW ORD-${n} ITEMS=${free.length}${skipped ? ` SKIPPED=${skipped}` : ""}`);
  D.toast(skipped ? `${code} נוצרה עם ${free.length} פריטים. ${skipped} פריטים שכבר בייצור דולגו.` : miss ? `${code} נוצרה בלי ${miss} פחים משלימים. הם יחכו לפקודה הבאה.` : `${code} נוצרה עם ${free.length} פריטים בשכבה נפרדת`);
  D.track("demo_action", { action: "order" });
  paint(); renderSide(); updateKpi();
}
function updateKpi() {
  D.kpi("total", S.recognized && D.step >= 2 ? items.length : ents.length);
  D.kpi("types", S.recognized ? S.types.length : "—");
  D.kpi("assigned", S.recognized ? Object.keys(S.assigned).length + "/" + items.length : "—");
  D.kpi("yield", S.recognized ? pct(totals(summary()).y) : "—");
}

let drag = null;
const hitItem = (target) => { const g = target && target.closest && target.closest(".pnl[data-id]"); return g && byId[g.dataset.id]; };
svg.addEventListener("pointermove", (e) => {
  const p = D.pt(e), it = hitItem(e.target);
  D.barMid(`Layer: <b>${it ? MATS[it.mat].layer : "A-CLAD-*"}</b>`);
  if (drag) {
    drag.cur = p;
    selRect.setAttribute("x", Math.min(drag.s.x, p.x)); selRect.setAttribute("y", Math.min(drag.s.y, p.y));
    selRect.setAttribute("width", Math.abs(p.x - drag.s.x)); selRect.setAttribute("height", Math.abs(p.y - drag.s.y));
    if (Math.abs(p.x - drag.s.x) > 150 || Math.abs(p.y - drag.s.y) > 150) selRect.setAttribute("visibility", "visible");
  }
});
svg.addEventListener("pointerdown", (e) => {
  if (D.step !== 3 || e.button !== 0) return;
  drag = { s: D.pt(e), cur: D.pt(e) };
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointerup", (e) => {
  if (D.step !== 3 || !drag) return;
  const p = drag.cur, moved = Math.abs(p.x - drag.s.x) > 150 || Math.abs(p.y - drag.s.y) > 150;
  selRect.setAttribute("visibility", "hidden");
  if (moved) {
    const x1 = Math.min(drag.s.x, p.x), x2 = Math.max(drag.s.x, p.x), y1 = Math.min(drag.s.y, p.y), y2 = Math.max(drag.s.y, p.y);
    items.forEach((q) => { const qy = Y(q.z, q.h); if (q.x < x2 && q.x + q.w > x1 && qy < y2 && qy + q.h > y1) S.sel.add(q.id); });
    D.cmd(`PA_SELECT WINDOW (${Math.round(x1)},${Math.round(H - y2)}) (${Math.round(x2)},${Math.round(H - y1)})`);
  } else {
    const it = hitItem(document.elementFromPoint(e.clientX, e.clientY));
    if (it) { S.sel.has(it.id) ? S.sel.delete(it.id) : S.sel.add(it.id); D.cmd(`PA_SELECT PICK ${S.typeOf[it.id].code}`); }
  }
  drag = null;
  paint(); renderSide();
});
svg.addEventListener("click", (e) => {
  const it = hitItem(e.target), t = it && S.typeOf[it.id];
  if (!t || !S.recognized) return;
  if (D.step === 2) {
    const i = S.types.indexOf(t), li = D.sideEl.querySelector(`.li[data-t="${i}"]`);
    D.sideEl.querySelectorAll(".li.on").forEach((x) => x.classList.remove("on"));
    if (li) { li.classList.add("on"); li.scrollIntoView({ block: "nearest" }); }
    S.pinType = null; S.hoverType = t; paint();
    setTimeout(() => { if (S.hoverType === t) { S.hoverType = null; paint(); } }, 1200);
  }
  if (D.step === 4) pickType(t);
});

function runScan() {
  scan.classList.remove("run"); void scan.getBBox(); scan.classList.add("run");
  items.forEach((p) => { const d = (p.x / W) * 1.1 + "s"; pEls[p.id].r.style.transitionDelay = d; pEls[p.id].t.style.transitionDelay = d; });
  setTimeout(() => items.forEach((p) => { pEls[p.id].r.style.transitionDelay = ""; pEls[p.id].t.style.transitionDelay = ""; }), 1800);
  D.toast(`זוהו ${items.length} פריטים ב־${S.types.length} סוגים, ${findings().filter((f) => f.pill === "warn").length} בדיקות דורשות החלטה`);
}

function onStep(n) {
  if (n >= 2 && !S.recognized) { recognize(); runScan(); }
  D.canvas.classList.toggle("selecting", n === 3);
  D.panLeft(n !== 3);
  if (n !== 3) S.sel.clear();
  if (n !== 2) S.hoverType = S.pinType = null;
  if (n === 4 && !typeByKey(S.selKey)) S.selKey = S.types[0].key;
  D.table(n === 5 ? tableHtml() : null);
  paint(); renderSide(); updateKpi();
  if (n === 3) D.hint("גררו מלבן על החזית כדי לבחור אזור");
}

D.ready();
})();
</script>
